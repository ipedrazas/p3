<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Pot Patterns</title>
    <meta name="description" content="Generate a printable PDF sewing pattern for a fabric plant pot cover." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3d7a57" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1><img src="/logo.svg" alt="" width="40" height="40" /> Plant Pot Patterns</h1>
      <p>Measure your pot, get a printable sewing pattern for a lined fabric cover with a folded cuff.</p>
    </header>

    <main class="app">
      <form id="form" class="panel controls" novalidate>
        <fieldset>
          <legend>Your pot</legend>
          <div class="segmented" role="radiogroup" aria-label="Measurements are">
            <label><input type="radio" name="measure" value="radius" /> <span>Radius</span></label>
            <label><input type="radio" name="measure" value="diameter" /> <span>Diameter</span></label>
          </div>
          <label class="field">
            <span><span data-measure-label>Top radius</span><small>across the rim</small></span>
            <span class="input"><input name="top" type="number" step="0.1" min="0" /><em>cm</em></span>
          </label>
          <label class="field">
            <span><span data-measure-label-base>Base radius</span><small>across the bottom</small></span>
            <span class="input"><input name="base" type="number" step="0.1" min="0" /><em>cm</em></span>
          </label>
          <label class="field">
            <span>Height<small>bottom to rim</small></span>
            <span class="input"><input name="height" type="number" step="0.1" min="0" /><em>cm</em></span>
          </label>
        </fieldset>

        <fieldset>
          <legend>The cover</legend>
          <label class="field">
            <span>Fold<small>height of the folded cuff, 0 for none</small></span>
            <span class="input"><input name="fold" type="number" step="0.1" min="0" /><em>cm</em></span>
          </label>
          <label class="field">
            <span>Ease<small>gap between pot and cover</small></span>
            <span class="input"><input name="ease" type="number" step="0.1" min="0" /><em>cm</em></span>
          </label>
          <label class="field">
            <span>Seam allowance<small>stitch line to cut edge</small></span>
            <span class="input"><input name="seam" type="number" step="0.1" min="0" /><em>cm</em></span>
          </label>
          <label class="field">
            <span>Side panels<small>one side seam per panel</small></span>
            <span class="input"><input name="panels" type="number" step="1" min="1" max="24" /><em>&nbsp;</em></span>
          </label>
          <label class="check">
            <input name="circular" type="checkbox" />
            <span>Round cover<small>Untick for a faceted cover with a flat-sided base (6 panels = hexagon).</small></span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Printing</legend>
          <label class="field stacked">
            <span>Page size</span>
            <select name="pageSize"></select>
          </label>
          <label class="check">
            <input name="onFold" type="checkbox" />
            <span>Cut on fold<small>Print half of each piece, marked "place on fold". Uses fewer pages.</small></span>
          </label>
          <label class="field">
            <span>Printer scale<small>If the 10 cm test ruler prints as 9.8 cm, enter 98</small></span>
            <span class="input"><input name="printScale" type="number" step="0.1" min="80" max="120" /><em>%</em></span>
          </label>
        </fieldset>

        <ul id="errors" class="errors" role="alert" hidden></ul>

        <div class="actions">
          <button id="download" type="button" class="primary">Download PDF pattern</button>
          <button id="reset" type="button" class="ghost">Reset</button>
        </div>
      </form>

      <section class="panel output" aria-live="polite">
        <div class="output-head">
          <div>
            <h2>Pattern layout</h2>
            <p id="pages" class="muted"></p>
          </div>
          <div class="section-view" id="section" aria-label="Cross-section of pot and cover"></div>
        </div>
        <dl id="stats" class="stats"></dl>
        <div id="sheet" class="sheet"></div>
        <details class="howto">
          <summary>Sewing instructions</summary>
          <ol id="steps"></ol>
        </details>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
